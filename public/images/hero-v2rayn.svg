<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="v2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <circle cx="850" cy="300" r="230" fill="#2563EB" opacity="0.1" filter="url(#glow)" />

  <g transform="translate(80, 120)">
    <g>
      <rect width="170" height="30" rx="15" fill="#1E293B" stroke="#2563EB" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#2563EB" />
      <text x="28" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">WINDOWS • 客户端深度</text>
    </g>

    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">
      v2rayN 核心进阶
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="url(#v2Grad)">
      Xray / Sing-box 双核切换与自定义路由
    </text>

    <text x="0" y="195" font-family="sans-serif" font-size="16" fill="#94A3B8">
      7.x 新架构 • TUN 虚拟网卡 • PAC / 全局 / 绕过大陆智能路由
    </text>

    <g transform="translate(0, 240)">
      <rect width="140" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
      <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Xray / Sing-box</text>

      <g transform="translate(152, 0)">
        <rect width="130" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
        <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#10B981">TUN 模式</text>
      </g>

      <g transform="translate(294, 0)">
        <rect width="130" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
        <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#2563EB">批量真实测速</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: v2rayN 'V' Core Switcher & Window HUD -->
  <g transform="translate(850, 310)">
    <!-- Stylized V Monogram -->
    <path d="M-80,-70 L0,70 L80,-70" fill="none" stroke="url(#v2Grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <path d="M-45,-70 L0,20 L45,-70" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Pulse Node -->
    <circle cx="0" cy="20" r="8" fill="#38BDF8" filter="url(#glow)" />

    <!-- Floating HUD 1: Core Switcher -->
    <g transform="translate(-210, -140)">
      <rect width="170" height="54" rx="8" fill="#0B111A" stroke="#2563EB" stroke-width="1.5" />
      <text x="14" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#94A3B8">CORE ENGINE</text>
      <text x="14" y="40" font-family="monospace" font-size="12" fill="#10B981">Xray-core v1.8.x Active</text>
    </g>

    <!-- Floating HUD 2: System Proxy State -->
    <g transform="translate(50, 90)">
      <rect width="180" height="54" rx="8" fill="#0B111A" stroke="#0284C7" stroke-width="1.5" />
      <text x="14" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#94A3B8">ROUTING MODE</text>
      <text x="14" y="40" font-family="monospace" font-size="12" fill="#38BDF8">Bypass Mainland (TUN)</text>
    </g>
  </g>
</svg>
