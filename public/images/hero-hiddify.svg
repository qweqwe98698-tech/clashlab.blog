<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="hidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <circle cx="850" cy="300" r="230" fill="#0284C7" opacity="0.1" filter="url(#glow)" />

  <g transform="translate(80, 120)">
    <g>
      <rect width="170" height="30" rx="15" fill="#1E293B" stroke="#0284C7" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#0284C7" />
      <text x="28" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">CLIENT • 跨平台全能</text>
    </g>

    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">
      Hiddify Next 全能客户端
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="url(#hidGrad)">
      跨平台极简上手与多协议自适应
    </text>

    <text x="0" y="195" font-family="sans-serif" font-size="16" fill="#94A3B8">
      基于 Sing-box 核心 • Windows/macOS/iOS/Android • WARP 链式代理
    </text>

    <g transform="translate(0, 240)">
      <rect width="130" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
      <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#38BDF8">全平台通用</text>

      <g transform="translate(142, 0)">
        <rect width="130" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
        <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#10B981">WARP 链式</text>
      </g>

      <g transform="translate(284, 0)">
        <rect width="140" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
        <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#0284C7">智能自动路由</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: Hiddify Shield & Cross-Platform Rings -->
  <g transform="translate(850, 310)">
    <!-- Cyber Shield -->
    <path d="M0,-85 L70,-45 L70,30 C70,80 0,110 0,110 C0,110 -70,80 -70,30 L-70,-45 Z" fill="#121A24" stroke="url(#hidGrad)" stroke-width="3" filter="url(#glow)" />
    
    <!-- H Monogram in Shield -->
    <line x1="-24" y1="-28" x2="-24" y2="28" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <line x1="24" y1="-28" x2="24" y2="28" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />

    <!-- Platform Orbit Rings -->
    <circle cx="0" cy="10" r="140" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6" />
    
    <!-- Platform Node Badges -->
    <g transform="translate(-140, 10)">
      <circle cx="0" cy="0" r="14" fill="#0B111A" stroke="#38BDF8" stroke-width="1.5" />
      <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#38BDF8">WIN</text>
    </g>
    <g transform="translate(140, 10)">
      <circle cx="0" cy="0" r="14" fill="#0B111A" stroke="#10B981" stroke-width="1.5" />
      <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#10B981">MAC</text>
    </g>
    <g transform="translate(0, -130)">
      <circle cx="0" cy="0" r="14" fill="#0B111A" stroke="#0284C7" stroke-width="1.5" />
      <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0284C7">IOS</text>
    </g>
    <g transform="translate(0, 150)">
      <circle cx="0" cy="0" r="14" fill="#0B111A" stroke="#10B981" stroke-width="1.5" />
      <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#10B981">AND</text>
    </g>
  </g>
</svg>
