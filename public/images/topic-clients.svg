<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111A" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#grid)" />

  <circle cx="400" cy="240" r="180" fill="#2563EB" opacity="0.1" filter="url(#glow)" />

  <!-- Multi-Device Hub Visual -->
  <g transform="translate(400, 230)">
    <!-- Central Hub Orbit Ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 4" />

    <!-- Center Core Node -->
    <circle cx="0" cy="0" r="42" fill="#121A24" stroke="url(#clientGrad)" stroke-width="2.5" filter="url(#glow)" />
    <path d="M-12,-12 L12,-12 L-4,0 L8,0 L-10,14 L-2,2 L-10,2 Z" fill="#38BDF8" />

    <!-- Windows Satellite (Top) -->
    <g transform="translate(0, -120)">
      <circle cx="0" cy="0" r="28" fill="#0B111A" stroke="#38BDF8" stroke-width="1.5" />
      <path d="M-8,-8 L-1,-7 V-1 H-8 Z M1,-7 L8,-8 V-1 H1 Z M-8,1 H-1 V7 L-8,8 Z M1,1 H8 V8 L1,7 Z" fill="#38BDF8" />
    </g>

    <!-- macOS / iOS Apple Satellite (Right) -->
    <g transform="translate(120, 0)">
      <circle cx="0" cy="0" r="28" fill="#0B111A" stroke="#FFFFFF" stroke-width="1.5" />
      <path d="M2,-7 C2.5,-8.5 4,-9 4,-9 C4,-9 3.5,-7.5 2,-7 Z M6,2 C6,6 3.5,8 1,8 C-1.5,8 -2,6 -4,6 C-6,6 -7.5,7 -8,7 C-9,5 -10,1 -8,-3 C-7,-5 -4.5,-6 -2.5,-6 C-0.5,-6 1,-4.5 2.5,-4.5 C4,-4.5 5,-6 6.5,-6 C8,-6 9,-4 8.5,-2 Z" fill="#FFFFFF" transform="scale(0.8) translate(-1, -1)" />
    </g>

    <!-- Android Bugdroid Satellite (Bottom) -->
    <g transform="translate(0, 120)">
      <circle cx="0" cy="0" r="28" fill="#0B111A" stroke="#10B981" stroke-width="1.5" />
      <path d="M-8,2 A8,8 0 0,1 8,2 H-8 Z" fill="#10B981" />
      <circle cx="-3" cy="-1" r="1" fill="#0B111A" />
      <circle cx="3" cy="-1" r="1" fill="#0B111A" />
    </g>

    <!-- Linux Satellite (Left) -->
    <g transform="translate(-120, 0)">
      <circle cx="0" cy="0" r="28" fill="#0B111A" stroke="#F59E0B" stroke-width="1.5" />
      <path d="M-5,-4 C-5,-8 -2,-9 0,-9 C2,-9 5,-8 5,-4 C5,2 7,4 7,8 C7,9 5,10 0,10 C-5,10 -7,9 -7,8 C-7,4 -5,2 -5,-4 Z" fill="#F59E0B" />
      <ellipse cx="0" cy="2" rx="3" ry="4" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Bottom Title Block -->
  <g transform="translate(400, 470)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">
      全平台客户端专区
    </text>
    <text y="32" font-family="sans-serif" font-size="15" fill="#94A3B8">
      Clash Verge Rev • Sing-box • Shadowrocket • v2rayN • Hiddify
    </text>
  </g>
</svg>
