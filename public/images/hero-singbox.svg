<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="singGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <circle cx="860" cy="300" r="230" fill="#6366F1" opacity="0.1" filter="url(#glow)" />
  <circle cx="320" cy="450" r="160" fill="#38BDF8" opacity="0.08" filter="url(#glow)" />

  <!-- Left Text -->
  <g transform="translate(80, 120)">
    <g>
      <rect width="170" height="30" rx="15" fill="#1E293B" stroke="#6366F1" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#6366F1" />
      <text x="28" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#A855F7" letter-spacing="1">SING-BOX • 核心架构</text>
    </g>

    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">
      Sing-box 极速内核
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="url(#singGrad)">
      高性能 JSON 配置与规则集实战
    </text>

    <text x="0" y="195" font-family="sans-serif" font-size="16" fill="#94A3B8">
      Inbound / Outbound 架构 • Rule-Set 二进制规则 • 全协议原生长连接
    </text>

    <g transform="translate(0, 240)">
      <rect width="140" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
      <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Rule-Set 规则集</text>

      <g transform="translate(152, 0)">
        <rect width="130" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
        <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#A855F7">VLESS Reality</text>
      </g>

      <g transform="translate(294, 0)">
        <rect width="130" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
        <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#10B981">Hysteria 2</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: Isometric S-Cube Router Node -->
  <g transform="translate(850, 310)">
    <!-- Circuit Rays -->
    <path d="M-200,-100 L-90,-30 L-90,60 L-180,120" stroke="#1E293B" stroke-width="2" fill="none" />
    <path d="M120,-110 L50,-30 L50,80 L160,130" stroke="#1E293B" stroke-width="2" fill="none" />
    <line x1="-90" y1="-30" x2="0" y2="0" stroke="#6366F1" stroke-width="2.5" />
    <line x1="0" y1="0" x2="50" y2="80" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="6 4" />

    <!-- Isometric 3D S-Cube -->
    <g transform="scale(1.3)">
      <!-- Top Polygon -->
      <polygon points="0,-70 70,-30 0,10 -70,-30" fill="#6366F1" opacity="0.9" />
      <!-- Left Polygon -->
      <polygon points="-70,-30 0,10 0,90 -70,50" fill="#3B82F6" />
      <!-- Right Polygon -->
      <polygon points="0,10 70,-30 70,50 0,90" fill="#1D4ED8" />

      <!-- S-Wave inside Box -->
      <path d="M30,-45 C10,-60 -20,-50 -35,-30 C-45,-15 -35,5 -10,15 C20,25 35,40 25,60 C15,75 -15,80 -35,65" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
    </g>

    <!-- Floating JSON Config HUD -->
    <g transform="translate(-230, -165)">
      <rect width="180" height="70" rx="8" fill="#0B111A" stroke="#6366F1" stroke-width="1.5" />
      <text x="14" y="22" font-family="monospace" font-size="11" fill="#38BDF8">"type": "hysteria2"</text>
      <text x="14" y="40" font-family="monospace" font-size="11" fill="#A855F7">"tag": "proxy-out"</text>
      <text x="14" y="58" font-family="monospace" font-size="11" fill="#10B981">"rule_set": "geoip-cn"</text>
    </g>

    <!-- Floating Speed HUD -->
    <g transform="translate(60, 100)">
      <rect width="160" height="54" rx="8" fill="#0B111A" stroke="#A855F7" stroke-width="1.5" />
      <text x="14" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#94A3B8">ROUTING ENGINE</text>
      <text x="14" y="40" font-family="monospace" font-size="13" font-weight="700" fill="#10B981">0.12ms LATENCY</text>
    </g>
  </g>
</svg>
