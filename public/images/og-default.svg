<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111A" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glowing Blobs -->
  <circle cx="950" cy="220" r="220" fill="#2563EB" opacity="0.12" filter="url(#glow)" />
  <circle cx="400" cy="500" r="180" fill="#0284C7" opacity="0.08" filter="url(#glow)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#primaryGrad)" />

  <!-- Left Content Column -->
  <g transform="translate(90, 110)">
    <!-- Site Badge -->
    <g transform="translate(0, 0)">
      <rect width="210" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#10B981" />
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="1">CLASHLAB.BLOG 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      ClashLab
    </text>
    <text x="240" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="url(#primaryGrad)">
      前沿网络协议实验室
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
      现代代理技术架构 • 客户端全指南 • 专线评测 • 规则与安全
    </text>

    <!-- Core Technology Pill Badges -->
    <g transform="translate(0, 200)">
      <!-- Badge 1: Clash Verge Rev -->
      <g transform="translate(0, 0)">
        <rect width="150" height="36" rx="8" fill="#151E2B" stroke="#2563EB" stroke-width="1" />
        <text x="18" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Clash Verge Rev</text>
      </g>
      <!-- Badge 2: Sing-box -->
      <g transform="translate(162, 0)">
        <rect width="110" height="36" rx="8" fill="#151E2B" stroke="#0284C7" stroke-width="1" />
        <text x="18" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Sing-box</text>
      </g>
      <!-- Badge 3: IPLC 专线 -->
      <g transform="translate(284, 0)">
        <rect width="115" height="36" rx="8" fill="#151E2B" stroke="#38BDF8" stroke-width="1" />
        <text x="18" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">IPLC 专线</text>
      </g>
      <!-- Badge 4: Hysteria 2 / TUIC -->
      <g transform="translate(411, 0)">
        <rect width="145" height="36" rx="8" fill="#151E2B" stroke="#8B5CF6" stroke-width="1" />
        <text x="18" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Hysteria 2 / TUIC</text>
      </g>
    </g>

    <!-- Features Row -->
    <g transform="translate(0, 280)">
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="4" fill="#38BDF8" />
        <text x="24" y="15" font-family="sans-serif" font-size="15" font-weight="500" fill="#CBD5E1">0 延迟丢包排查</text>
      </g>
      <g transform="translate(160, 0)">
        <circle cx="10" cy="10" r="4" fill="#38BDF8" />
        <text x="24" y="15" font-family="sans-serif" font-size="15" font-weight="500" fill="#CBD5E1">Fake-IP 防 DNS 泄露</text>
      </g>
      <g transform="translate(360, 0)">
        <circle cx="10" cy="10" r="4" fill="#38BDF8" />
        <text x="24" y="15" font-family="sans-serif" font-size="15" font-weight="500" fill="#CBD5E1">TUN 虚拟网卡智能分流</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: High-Tech Network Topology & Core Server Cube -->
  <g transform="translate(880, 310)">
    <!-- Circuit Topology Lines -->
    <path d="M-220,-120 L-100,-40 L-100,60 L-200,120" stroke="#1E293B" stroke-width="2" fill="none" />
    <path d="M120,-140 L40,-40 L40,80 L140,150" stroke="#1E293B" stroke-width="2" fill="none" />
    <path d="M-100,-40 L0,0 L40,-40" stroke="#2563EB" stroke-width="2.5" fill="none" />
    <path d="M-100,60 L0,0 L40,80" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4" fill="none" />

    <!-- Isometric Core Node Cube -->
    <g>
      <!-- Top -->
      <polygon points="0,-70 70,-30 0,10 -70,-30" fill="#38BDF8" opacity="0.9" />
      <!-- Left -->
      <polygon points="-70,-30 0,10 0,90 -70,50" fill="#1D4ED8" />
      <!-- Right -->
      <polygon points="0,10 70,-30 70,50 0,90" fill="#2563EB" />
      <!-- Glow Symbol -->
      <circle cx="0" cy="10" r="22" fill="#FFFFFF" opacity="0.2" filter="url(#glow)" />
      <path d="M-8,-25 L12,-25 L-2,-5 L10,-5 L-10,32 L-2,8 L-14,8 Z" fill="#FFFFFF" />
    </g>

    <!-- Floating Telemetry HUD Card 1 (Speed & Latency) -->
    <g transform="translate(-240, -170)">
      <rect width="180" height="64" rx="10" fill="#0B111A" stroke="#2563EB" stroke-width="1.2" filter="url(#glow)" opacity="0.95" />
      <text x="16" y="24" font-family="monospace" font-size="11" fill="#94A3B8">IEPL ULTRA LOW RTT</text>
      <text x="16" y="48" font-family="monospace" font-size="20" font-weight="700" fill="#10B981">1.8 ms <tspan font-size="12" fill="#64748B">Jitter 0.1ms</tspan></text>
      <circle cx="160" cy="20" r="4" fill="#10B981" />
    </g>

    <!-- Floating Telemetry HUD Card 2 (Throughput) -->
    <g transform="translate(70, 70)">
      <rect width="170" height="64" rx="10" fill="#0B111A" stroke="#0284C7" stroke-width="1.2" filter="url(#glow)" opacity="0.95" />
      <text x="16" y="24" font-family="monospace" font-size="11" fill="#94A3B8">HYSTERIA 2 / QUIC</text>
      <text x="16" y="48" font-family="monospace" font-size="20" font-weight="700" fill="#38BDF8">982 Mbps <tspan font-size="11" fill="#10B981">BBR</tspan></text>
      <circle cx="150" cy="20" r="4" fill="#38BDF8" />
    </g>
  </g>

  <!-- Bottom Brand Watermark -->
  <g transform="translate(90, 560)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748B">
      https://clashlab.blog • 深入剖析现代代理协议与网络工程
    </text>
  </g>
</svg>
