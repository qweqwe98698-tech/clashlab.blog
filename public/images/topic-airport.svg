<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111A" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="airGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#grid)" />

  <circle cx="400" cy="240" r="180" fill="#F59E0B" opacity="0.08" filter="url(#glow)" />

  <!-- Node Cluster & Speed Radar Visual -->
  <g transform="translate(400, 230)">
    <!-- Global Latency Polygon -->
    <polygon points="0,-100 95,-30 60,80 -60,80 -95,-30" fill="none" stroke="#1E293B" stroke-width="1.5" />
    <polygon points="0,-75 75,-25 45,60 -45,60 -75,-25" fill="#121A24" stroke="url(#airGrad)" stroke-width="2" filter="url(#glow)" />

    <!-- Node Points -->
    <circle cx="0" cy="-75" r="5" fill="#10B981" />
    <circle cx="75" cy="-25" r="5" fill="#38BDF8" />
    <circle cx="45" cy="60" r="5" fill="#F59E0B" />
    <circle cx="-45" cy="60" r="5" fill="#10B981" />
    <circle cx="-75" cy="-25" r="5" fill="#38BDF8" />

    <!-- Center Radar Symbol -->
    <circle cx="0" cy="0" r="18" fill="#0B111A" stroke="#EF4444" stroke-width="1.5" />
    <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#EF4444">SLA</text>
  </g>

  <!-- Bottom Title Block -->
  <g transform="translate(400, 470)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">
      机场评测与专线观察
    </text>
    <text y="32" font-family="sans-serif" font-size="15" fill="#94A3B8">
      晚高峰抗压实测 • IPLC / IEPL 专线 • 节点倍率避坑与解锁指南
    </text>
  </g>
</svg>
