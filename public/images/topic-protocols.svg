<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111A" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="protoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#grid)" />

  <circle cx="400" cy="240" r="180" fill="#8B5CF6" opacity="0.08" filter="url(#glow)" />

  <!-- Protocol Encryption Pipeline Visual -->
  <g transform="translate(400, 230)">
    <!-- Outer Encryption Tunnel -->
    <rect x="-180" y="-50" width="360" height="100" rx="14" fill="#121A24" stroke="url(#protoGrad)" stroke-width="2" filter="url(#glow)" />
    
    <!-- Internal Multiplexed Data Streams -->
    <path d="M-150,-20 C-90,-20 -90,20 -30,20 C30,20 30,-20 90,-20 C120,-20 130,-10 150,-10" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <path d="M-150,20 C-90,20 -90,-20 -30,-20 C30,-20 30,20 90,20 C120,20 130,10 150,10" fill="none" stroke="#EC4899" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" />

    <!-- Center TLS Reality Shield Lock -->
    <circle cx="0" cy="0" r="28" fill="#0B111A" stroke="#8B5CF6" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FFFFFF">QUIC</text>
  </g>

  <!-- Bottom Title Block -->
  <g transform="translate(400, 470)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">
      现代代理协议研报
    </text>
    <text y="32" font-family="sans-serif" font-size="15" fill="#94A3B8">
      VLESS Reality • Hysteria 2 • TUIC v5 • Shadowsocks 深度剖析
    </text>
  </g>
</svg>
