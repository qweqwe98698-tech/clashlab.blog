<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111A" />
      <stop offset="50%" stop-color="#0D1929" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="dnsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <circle cx="850" cy="300" r="230" fill="#10B981" opacity="0.08" filter="url(#glow)" />

  <g transform="translate(80, 120)">
    <g>
      <rect width="170" height="30" rx="15" fill="#1E293B" stroke="#10B981" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#10B981" />
      <text x="28" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#10B981" letter-spacing="1">SECURITY • 安全解析</text>
    </g>

    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">
      防止 DNS 泄漏与 Fake-IP
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="url(#dnsGrad)">
      打造零污染高安全性解析链
    </text>

    <text x="0" y="195" font-family="sans-serif" font-size="16" fill="#94A3B8">
      DoH / DoT 加密通道 • Fake-IP 虚拟 IP 池 • 规避 SNI 嗅探与污染
    </text>

    <g transform="translate(0, 240)">
      <rect width="130" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
      <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#10B981">Fake-IP 模式</text>

      <g transform="translate(142, 0)">
        <rect width="130" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
        <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#06B6D4">DoH / DoT 加密</text>
      </g>

      <g transform="translate(284, 0)">
        <rect width="140" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
        <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#38BDF8">0 污染 Fallback</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: Shield Gateway & DNS Pipeline Node -->
  <g transform="translate(850, 310)">
    <!-- Shield Outline -->
    <path d="M0,-90 L80,-45 L80,30 C80,85 0,115 0,115 C0,115 -80,85 -80,30 L-80,-45 Z" fill="#121A24" stroke="url(#dnsGrad)" stroke-width="3" filter="url(#glow)" />
    
    <!-- Lock / Keyhole Icon in Shield -->
    <circle cx="0" cy="5" r="14" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <path d="M-8,-2 C-8,-14 8,-14 8,-2" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="0" cy="5" r="3" fill="#10B981" />

    <!-- DNS Pipeline Rings -->
    <circle cx="0" cy="15" r="120" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="0" cy="15" r="160" fill="none" stroke="#1E293B" stroke-width="1.5" />

    <!-- Floating IP Translation HUD -->
    <g transform="translate(-230, -150)">
      <rect width="180" height="54" rx="8" fill="#0B111A" stroke="#10B981" stroke-width="1.5" />
      <text x="14" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#94A3B8">DNS FAKE-IP MAPPING</text>
      <text x="14" y="40" font-family="monospace" font-size="12" fill="#38BDF8">google.com => 198.18.0.2</text>
    </g>
  </g>
</svg>
