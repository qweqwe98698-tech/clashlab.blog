<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <circle cx="850" cy="300" r="230" fill="#0284C7" opacity="0.1" filter="url(#glow)" />

  <g transform="translate(80, 120)">
    <g>
      <rect width="170" height="30" rx="15" fill="#1E293B" stroke="#0284C7" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#0284C7" />
      <text x="28" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">IOS • 客户端进阶</text>
    </g>

    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">
      Shadowrocket 小火箭
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="url(#rocketGrad)">
      iOS 终极配置：Lazy 规则与 MitM
    </text>

    <text x="0" y="195" font-family="sans-serif" font-size="16" fill="#94A3B8">
      节点订阅 • 按需连接 (On Demand) • 广告拦截与脚本重写
    </text>

    <g transform="translate(0, 240)">
      <rect width="130" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
      <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Lazy 规则分流</text>

      <g transform="translate(142, 0)">
        <rect width="130" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
        <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#0284C7">On Demand</text>
      </g>

      <g transform="translate(284, 0)">
        <rect width="130" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
        <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#10B981">MitM HTTPS</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: Rocket Taking Off with Fiber Trails -->
  <g transform="translate(860, 310)">
    <!-- Speed Lines -->
    <line x1="-120" y1="120" x2="-220" y2="220" stroke="#1E293B" stroke-width="3" />
    <line x1="-60" y1="140" x2="-140" y2="220" stroke="#0284C7" stroke-width="2" stroke-dasharray="8 6" />

    <!-- Rocket Body -->
    <g transform="rotate(-45) scale(1.4)">
      <!-- Thruster Flame -->
      <polygon points="-8,45 8,45 0,75" fill="#F59E0B" filter="url(#glow)" />
      <polygon points="-5,45 5,45 0,65" fill="#EF4444" />
      
      <!-- Wings -->
      <polygon points="-16,20 -35,38 -16,38" fill="#1D4ED8" />
      <polygon points="16,20 35,38 16,38" fill="#1D4ED8" />
      
      <!-- Main Fuselage -->
      <path d="M0,-45 C18,-20 18,35 0,42 C-18,35 -18,-20 0,-45 Z" fill="#121A24" stroke="#38BDF8" stroke-width="2.5" />
      
      <!-- Porthole Window -->
      <circle cx="0" cy="-6" r="8" fill="#0B111A" stroke="#38BDF8" stroke-width="2" />
      <circle cx="0" cy="-6" r="4" fill="#38BDF8" filter="url(#glow)" />
    </g>

    <!-- Floating HUD -->
    <g transform="translate(-220, -150)">
      <rect width="180" height="54" rx="8" fill="#0B111A" stroke="#0284C7" stroke-width="1.5" />
      <text x="14" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#94A3B8">ON DEMAND ROUTE</text>
      <text x="14" y="40" font-family="monospace" font-size="12" fill="#10B981">Wi-Fi & Cellular Auto</text>
    </g>
  </g>
</svg>
