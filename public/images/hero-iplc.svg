<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111A" />
      <stop offset="50%" stop-color="#0D1929" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="fiberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <circle cx="850" cy="300" r="240" fill="#06B6D4" opacity="0.1" filter="url(#glow)" />

  <g transform="translate(80, 120)">
    <g>
      <rect width="170" height="30" rx="15" fill="#1E293B" stroke="#10B981" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#10B981" />
      <text x="28" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#10B981" letter-spacing="1">NETWORK • 专线深度</text>
    </g>

    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">
      IPLC 与 IEPL 专线
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="url(#fiberGrad)">
      跨境低延迟与晚高峰 0 丢包真相
    </text>

    <text x="0" y="195" font-family="sans-serif" font-size="16" fill="#94A3B8">
      BGP 多线入口 • 物理内网裸纤 • 晚高峰无 QoS 降速与抖动对比
    </text>

    <g transform="translate(0, 240)">
      <rect width="130" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
      <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#10B981">0% 丢包率</text>

      <g transform="translate(142, 0)">
        <rect width="130" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
        <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#06B6D4">物理层直连</text>
      </g>

      <g transform="translate(284, 0)">
        <rect width="150" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
        <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#38BDF8">晚高峰抗拥堵</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: Dedicated Fiber Optical Conduit Pipe & Border Nodes -->
  <g transform="translate(850, 310)">
    <!-- Submarine Cable Arc -->
    <path d="M-220,100 C-100,-120 100,-120 220,100" stroke="#1E293B" stroke-width="8" fill="none" />
    <path d="M-220,100 C-100,-120 100,-120 220,100" stroke="url(#fiberGrad)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)" />
    
    <!-- Moving Packets -->
    <circle cx="-130" cy="15" r="5" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="0" cy="-65" r="6" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="130" cy="15" r="5" fill="#FFFFFF" filter="url(#glow)" />

    <!-- Left Ingress Router (BGP Ingress) -->
    <g transform="translate(-200, 90)">
      <rect x="-40" y="-30" width="80" height="60" rx="8" fill="#0B111A" stroke="#10B981" stroke-width="2" />
      <circle cx="0" cy="-6" r="12" fill="#10B981" opacity="0.2" />
      <text x="-24" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#10B981">SH BGP</text>
    </g>

    <!-- Right Egress Router (HK/JP Egress) -->
    <g transform="translate(200, 90)">
      <rect x="-40" y="-30" width="80" height="60" rx="8" fill="#0B111A" stroke="#38BDF8" stroke-width="2" />
      <circle cx="0" cy="-6" r="12" fill="#38BDF8" opacity="0.2" />
      <text x="-24" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#38BDF8">HK POP</text>
    </g>

    <!-- Floating HUD 1: Latency & Jitter Monitor -->
    <g transform="translate(-100, -180)">
      <rect width="200" height="64" rx="8" fill="#0B111A" stroke="#06B6D4" stroke-width="1.5" />
      <text x="14" y="22" font-family="monospace" font-size="11" fill="#94A3B8">IPLC SH -> HK RTT</text>
      <text x="14" y="46" font-family="monospace" font-size="18" font-weight="700" fill="#10B981">19.4 ms <tspan font-size="12" fill="#64748B">±0.2ms</tspan></text>
      <circle cx="180" cy="20" r="4" fill="#10B981" />
    </g>
  </g>
</svg>
