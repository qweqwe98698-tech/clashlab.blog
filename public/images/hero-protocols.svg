<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="protoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <circle cx="850" cy="300" r="230" fill="#8B5CF6" opacity="0.1" filter="url(#glow)" />

  <g transform="translate(80, 120)">
    <g>
      <rect width="170" height="30" rx="15" fill="#1E293B" stroke="#8B5CF6" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#8B5CF6" />
      <text x="28" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#8B5CF6" letter-spacing="1">PROTOCOLS • 协议矩阵</text>
    </g>

    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">
      2026 代理协议大横评
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="url(#protoGrad)">
      Reality / Hysteria 2 / TUIC 架构剖析
    </text>

    <text x="0" y="195" font-family="sans-serif" font-size="16" fill="#94A3B8">
      TLS 真实证书伪装 • QUIC 拥塞控制 • 高丢包环境下的吞吐实测
    </text>

    <g transform="translate(0, 240)">
      <rect width="140" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
      <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#38BDF8">VLESS Reality</text>

      <g transform="translate(152, 0)">
        <rect width="130" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
        <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#8B5CF6">Hysteria 2</text>
      </g>

      <g transform="translate(294, 0)">
        <rect width="130" height="36" rx="8" fill="#151E2B" stroke="#1E293B" />
        <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#EC4899">TUIC v5</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: Protocol Stack Architecture Matrix -->
  <g transform="translate(850, 310)">
    <!-- Layer 3: Physical / UDP / TCP -->
    <g transform="translate(-160, 60)">
      <rect width="320" height="48" rx="8" fill="#0B111A" stroke="#1E293B" stroke-width="1.5" />
      <text x="16" y="28" font-family="monospace" font-size="13" font-weight="700" fill="#64748B">TRANSPORT</text>
      <text x="130" y="28" font-family="monospace" font-size="12" fill="#38BDF8">UDP (QUIC) / TCP BBR</text>
    </g>

    <!-- Layer 2: Security & Obfuscation -->
    <g transform="translate(-160, 0)">
      <rect width="320" height="48" rx="8" fill="#121A24" stroke="#8B5CF6" stroke-width="1.5" />
      <text x="16" y="28" font-family="monospace" font-size="13" font-weight="700" fill="#8B5CF6">SECURITY</text>
      <text x="130" y="28" font-family="monospace" font-size="12" fill="#FFFFFF">TLS 1.3 / Reality Handshake</text>
    </g>

    <!-- Layer 1: Proxy Protocol -->
    <g transform="translate(-160, -60)">
      <rect width="320" height="48" rx="8" fill="#151E2B" stroke="#38BDF8" stroke-width="1.5" />
      <text x="16" y="28" font-family="monospace" font-size="13" font-weight="700" fill="#38BDF8">PROTOCOL</text>
      <text x="130" y="28" font-family="monospace" font-size="12" fill="#10B981">Zero-RTT Multiplexing</text>
    </g>

    <!-- Top Connection Node -->
    <circle cx="0" cy="-110" r="18" fill="#8B5CF6" opacity="0.2" filter="url(#glow)" />
    <circle cx="0" cy="-110" r="6" fill="#8B5CF6" />
    <line x1="0" y1="-100" x2="0" y2="-60" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 3" />
  </g>
</svg>
